name: continuous-integration

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:
    branches:
    - main

env:
  GO_VERSION: "~1.27"

jobs:
  ci-go-lint:
    name: ci-go-lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
      id: go

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9

  ci-unit-tests:
    name: ci-unit-tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
      id: go
      
    - name: Install Chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable

    - name: Allow Chrome's sandbox (AppArmor restricts unprivileged userns on newer images)
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

    # The merman CLI backend renders through this binary. Without it the tests
    # that exercise a real merman skip, and only the fake-binary tests run. The
    # fallback releases before 0.8 take, having no `capabilities` command, is
    # covered by the scripted binary in the tests.
    - name: Install merman-cli
      env:
        MERMAN_VERSION: v0.9.3
        MERMAN_TARGET: x86_64-unknown-linux-gnu
      run: |
        set -euo pipefail
        workdir="$(mktemp -d)"
        cd "$workdir"
        tarball="merman-cli-${MERMAN_TARGET}.tar.xz"
        base="https://github.com/Latias94/merman/releases/download/${MERMAN_VERSION}"
        curl -fsSLO "${base}/${tarball}"
        curl -fsSLO "${base}/${tarball}.sha256"
        sha256sum -c "${tarball}.sha256"
        tar -xJf "${tarball}"
        mkdir -p "$HOME/.local/bin"
        install -m755 "merman-cli-${MERMAN_TARGET}/merman-cli" "$HOME/.local/bin/merman-cli"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        rm -rf "$workdir"

    # The WebAssembly tests run the module mermanwasm embeds. Their caller-font
    # case needs a font file to pass in, and any font the runner has will do.
    - name: Point the WebAssembly tests at a font
      run: |
        font="$(fc-list --format '%{file}\n' | grep -m1 '\.ttf$' || true)"
        if [ -n "$font" ]; then echo "MERMAN_WASI_FONT=$font" >> "$GITHUB_ENV"; fi

    - name: Run unit tests
      run:  go test -v ./...

  ci-build-example:
    name: ci-build-example
    runs-on: ubuntu-22.04
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
      id: go

    - name: Build example
      run:  go build -o mermaid-example ./example/main.go

    - name: Run example
      run: ./mermaid-example
